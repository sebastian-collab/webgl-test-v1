<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta name="viewport"
          content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <title>Bible Trivia Adventure</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #231F20;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #unity-canvas {
        height: 100vh;
        width: auto;
        aspect-ratio: 9 / 16;
        max-width: 100vw;
        background: #231F20;
      }
    </style>
</head>

<body>

<canvas id="unity-canvas" tabindex="-1"></canvas>

<script src="Build/webgl-test-v1.loader.js"></script>

<script>
const canvas = document.querySelector("#unity-canvas");

createUnityInstance(canvas, {
    dataUrl: "Build/webgl-test-v1.data",
    frameworkUrl: "Build/webgl-test-v1.framework.js",
    codeUrl: "Build/webgl-test-v1.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "Bible Trivia Adventure",
    productVersion: "1.0",
});
</script>

</body>
</html>
